<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fd1ff"/>
      <stop offset="0.6" stop-color="#1e88e5"/>
      <stop offset="1" stop-color="#0d3b8c"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="280" fill="url(#sea)"/>

  <!-- light rays -->
  <g opacity="0.8">
    <polygon points="120,0 190,0 120,280 40,280" fill="url(#ray)">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="6s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="420,0 500,0 440,280 350,280" fill="url(#ray)">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="7s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="720,0 790,0 760,280 670,280" fill="url(#ray)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- sand -->
  <path d="M0 250 Q200 232 400 248 T900 244 V280 H0 Z" fill="#e9c97a"/>
  <path d="M0 262 Q250 250 500 262 T900 258 V280 H0 Z" fill="#d9b565"/>

  <!-- shells / coral on sand -->
  <g>
    <path d="M300 256 Q312 236 324 256 Z" fill="#ff8a65" stroke="#d84315" stroke-width="2"/>
    <path d="M590 258 Q604 236 618 258 Z" fill="#f48fb1" stroke="#c2185b" stroke-width="2"/>
    <circle cx="450" cy="258" r="6" fill="#fff3e0" stroke="#bcaaa4" stroke-width="2"/>
  </g>

  <!-- seaweed -->
  <g stroke="#2e9e4f" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M70 252 Q55 220 72 190 Q88 160 70 130">
      <animateTransform attributeName="transform" type="rotate" values="-4 70 252;4 70 252;-4 70 252" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M100 254 Q118 224 100 196 Q86 170 102 150">
      <animateTransform attributeName="transform" type="rotate" values="5 100 254;-5 100 254;5 100 254" dur="3.4s" repeatCount="indefinite"/>
    </path>
    <path d="M810 250 Q794 218 812 190 Q828 160 810 134">
      <animateTransform attributeName="transform" type="rotate" values="-5 810 250;5 810 250;-5 810 250" dur="3.8s" repeatCount="indefinite"/>
    </path>
    <path d="M840 252 Q858 222 840 196 Q826 174 842 154">
      <animateTransform attributeName="transform" type="rotate" values="4 840 252;-4 840 252;4 840 252" dur="4.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- bubbles -->
  <g fill="#ffffff" fill-opacity="0.35" stroke="#fff" stroke-opacity="0.8" stroke-width="1.5">
    <circle cx="200" cy="250" r="7"><animate attributeName="cy" values="250;-20" dur="7s" repeatCount="indefinite"/><animate attributeName="cx" values="200;215;200" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="250" r="5"><animate attributeName="cy" values="250;-20" dur="5.5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="250" r="9"><animate attributeName="cy" values="250;-20" dur="8s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="cx" values="560;545;560" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="250" r="6"><animate attributeName="cy" values="250;-20" dur="6s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="250" r="4"><animate attributeName="cy" values="250;-20" dur="4.5s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="250" r="5"><animate attributeName="cy" values="250;-20" dur="6.5s" begin="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="250" r="7"><animate attributeName="cy" values="250;-20" dur="7.5s" begin="1.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- text -->
  <text x="450" y="112" text-anchor="middle" font-family="Trebuchet MS, Verdana, sans-serif" font-size="40" font-weight="800" fill="#fff" stroke="#0d3b8c" stroke-width="1.5" paint-order="stroke">
    Thanks for diving by!
    <animate attributeName="opacity" values="0;1" dur="2s" fill="freeze"/>
  </text>
  <text x="450" y="148" text-anchor="middle" font-family="Trebuchet MS, Verdana, sans-serif" font-size="20" fill="#fff" fill-opacity="0.95">
    see you in the next dataset
    <animate attributeName="opacity" values="0;1" dur="3s" fill="freeze"/>
  </text>
</svg>
